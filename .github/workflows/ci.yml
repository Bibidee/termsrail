name: ci
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Repair production dependency lock
        run: npm audit fix --omit=dev
      - name: Commit repaired dependency lock when needed
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- package-lock.json package.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json package.json
            git commit -m "chore: repair production dependency audit findings"
            git push
          fi
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check:deployment
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: pytest -q tests/test_contract_direct.py tests/test_contract_security.py
      - run: genvm-lint check contracts/termsrail.py
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
